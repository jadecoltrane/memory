# 每天北京时间 04:23 在云端生成新一期工作台,不依赖任何本地设备开机。
# 需要仓库 secret:CLAUDE_CODE_OAUTH_TOKEN(本地终端跑 `claude setup-token` 生成)。
name: 工作台日更

on:
  # 刻意避开整点。Actions 的 schedule 是尽力而为,整点(尤其 0 分)排队最挤:
  # 原来的 "0 21" 实测常态迟到 59~77 分钟(出稿落在北京 06:00~06:30,而不是写的 05:00),
  # 2026-08-06 那班更是整点档整个没跑、顺延到 01:01 UTC,北京 09:01 才出稿。
  # 挪到 20:23 后按同样的延迟量级,落点回到北京 05:30 前。
  #
  # 保持排在每周 GC(cron "0 20" 周日)之后:GC 实测 20:48~20:57 起跑、跑 3~11 分钟,
  # 21:09 UTC 前收工,本任务预计 21:20 UTC 起跑,周一不会真撞上;万一撞上也无妨,
  # 两者共用下面的 memory-bot-push 并发组,只会排队不会并发推。
  schedule:
    - cron: "23 20 * * *" # UTC 20:23 = 北京时间次日 04:23
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

# 三个机器人共用一个并发组:同一时间只允许一个在推,后来的排队等前一个跑完。
# 不用 cancel-in-progress——它们各自的产物都要保留,取消掉等于当天没跑。
concurrency:
  group: memory-bot-push
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # 2026-08-16 删掉「写入今日页面渐变」这一步:用户要求页面背景不要渐变。
      # update_daily_gradient.py 一并删了(它找不到 CSS 里的标记行会 exit 1,留着日更天天红)

      # generated 是心跳报警的依据,不靠 prompt 遵守,前置机械写入(兜底优先)
      - name: 写入今日 generated 日期
        run: |
          sed -i "s/^generated:.*/generated: $(TZ=Asia/Shanghai date +%F)/" Home.md

      # 画作在 Claude 之前用纯脚本挑好,模型完全不参与:知名度是 sitelinks、
      # 流派/国别是结构化字段、链接通不通是 HTTP 状态码、中文简介是维基第一段,
      # 没有一处需要判断力。原来让模型 WebSearch 搜+验链接+写简介,一次几千 token。
      # 挑不出来时保留前一天的画,不让整轮日更失败(其余板块和它无关)。
      - name: 挑今日画作
        continue-on-error: true
        run: python3 Meta/scripts/pick_painting.py

      # 简讯候选同理:固定几家源的 RSS 用纯脚本拉,标题/链接/时间/摘要都是现成的。
      # 原来让模型满网搜 + 一篇篇打开,一次几十次抓取;现在模型只读这份清单挑 4 条、只打开这 4 篇。
      # 全挂了也不拦整轮日更,简讯那天写「今日未抓到可靠新闻」。
      - name: 拉简讯候选
        continue-on-error: true
        run: python3 Meta/scripts/fetch_news.py
      - name: Gemini 生成今日工作台
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: true
        with:
          gemini_api_key: ${{ secrets.GEMINI }}
          prompt: |
            当前目录就是个人记忆库仓库(jadecoltrane/memory)。读 Meta/WORKBENCH.md,严格按那份文件的规则更新 Home.md 的四个 AI 板块(📰 简讯 / 🎴 今日抽卡 / 🌱 今日延伸 / 📖 今日一读),以及横幅画作:

            - 📰 简讯:**正好 4 条**过去 48 小时的新闻:**中国 1 条**(清单「## 中国」组)+ **汽车新能源 1 条** + **国家大事和重大新闻 2 条**(国际时政/金融/科技),每条「**原文标题** / 中文标题 · [来源](链接) / 据报道……影响:……」,**「影响」讲这事会带来什么变化、帮她看懂为什么重要:落在国家、社会、国际格局还是普通人看情况,哪层最实在写哪层,不硬扯到个人;不往她工作上接、不往车上扯**,规则见 Meta/WORKBENCH.md,条间 `---`,版式见 Meta/WORKBENCH.md。**只从 `.news-candidates.md`(前置步骤拉好的固定源 RSS)里挑,链接原样用,不要 WebSearch/WebFetch 找新闻**;挑好的 4 条各跑一次 `python3 Meta/scripts/read_article.py <链接>` 读正文(不用 WebFetch,它对很多新闻站拒抓;脚本报错就用摘要),新闻事实只写来源里有的,不凭记忆补,正文不写「我只看了摘要」之类的声明。**用户金融时政经济知识不多、对西方政治不熟:专有名词和背景在「据报道」段里顺手讲清**(细则见 Meta/WORKBENCH.md)。清单不存在或没有够格的就少写,一条都没有就写「今日未抓到可靠新闻。」。**位置固定在 ✅ 每日习惯那个 dataviewjs 块正上方**,别挪到页面底下。写完跑 `python3 Meta/scripts/check_news_brief.py`,不通过就改
            - 🖼 画作导览:画已经由脚本挑好,**别动 painting-url/title/intro**。读 `.painting-sources.md`(挑画脚本备的维基正文),按 Meta/WORKBENCH.md「画作导览」写五段草稿到 `/tmp/guide.txt`,跑 `python3 Meta/scripts/painting_guide.py --set /tmp/guide.txt` 写进 Home.md,不通过就改。**用户是看画小白**:术语当场讲白,指画面上具体哪里;事实只写备料里有的,备料没抓到才凭记忆写并在「资料」段标「模型知识,未联网核查」
            - 📖 今日一读每天只出**一篇**,**只读不写:卡里不留任何回答区**(用户唯一动笔的地方是页面最后的 📔 日记井)。六个体裁轮着来——`对撞`(库里两条判断打架)/ `核查`(核实一条引用状主张)/ `复核`(重验一篇到期笔记)/ `串线`(把散在几篇里的同一条线索连起来)/ `反例`(给库里一条判断找外部最强反驳)/ `旧信`(回放一段日记或用户原话)
            - **选材前先跑 `python3 Meta/scripts/reading_log.py`**(体裁冷热 + 今天建议的体裁 + 禁用素材),**同一体裁 3 天内、14 天内超过 3 次不许再出,同一篇笔记/概念页 14 天内不许再当素材,主旨撞车的换掉**;建议的体裁今天没素材就换下一个,别硬凑。卡片标题固定 `> [!read] 📖 今日一读 · <体裁> · <一句话标题>`,**`· 体裁 ·` 不能省**(--check 拿它和台账对账);最后一段以 `**落点：**` 开头。出完稿往 `Meta/阅读台账.md` 追加一行(`日期 | 体裁 | 素材 | 主旨`),然后跑 `python3 Meta/scripts/reading_log.py --check`,**不通过就换一篇**(后置步骤会再跑一次,不通过整天日更失败)
            - 对撞/核查/复核/反例**必须带一块本库里查不到的东西**(具体研究、机制、反例、量级数字,或对两边共享的隐含前提的拆解),标 [事实]/[推论]/[观点];**有联网工具就当场核实作者年份期刊**,核过写明"已联网核查"+链接。禁止把「这印证了你库里已有的模式 X」当落点
            - 核查改宿主笔记的标注、复核往该篇 `## 复核记录` 追一行、反例站得住就追进正文——**这些回写算写入**,改了哪几篇要写进 commit message
            - 🌱 延伸写完后同步追加进对应概念页的延伸区(标注 [事实]/[推论]/[观点],注明未联网核查,禁止编造引用链接)
            - 📔 今日日记(页面最后那个 [!write] 井,井里保持空白——提示语由 dataviewjs 注入,别写进 markdown):**先读上一版里用户写的内容**,有就原文照抄追加进 `Diary/<年>/<年>-<月>.md`,段标题用**上一版 frontmatter 的 generated 日期**(不是今天),然后把新一期的井重新留空;空井跳过。不改写不提炼,归档了哪一天要写进 commit message。详细规则和错行排查见 Meta/WORKBENCH.md
            - 改动了 Concepts/、Notes/ 或 Diary/ 就运行 python3 Meta/scripts/build_memory_index.py 重建索引(后置步骤也会跑一次,这里是双保险)
            - 控制成本:只读 Meta/index.md 和选中的少数文件;抽卡去重优先看各篇 frontmatter 的 `last-surfaced:`(没有该字段的排最前),git log 只作兜底。**抽中的每篇都要写上 `last-surfaced: 当天日期`**
            - 文件顶部 frontmatter 之后那五行(`🎴 …#工作台` 开头、末尾两行零宽空格占位)是给 iOS 主屏小组件看的纯文本速览,由后置脚本机械重写,**原样保留、不要手改**
            - ## 标题、所有 dataviewjs 区块(横幅、信息条、今日内容折叠壳外层结构、统计卡、🎲 随机重逢卡、✅ 每日习惯卡,含心跳报警)、callout 卡片语法全部原样保留;frontmatter 保留 cssclasses;generated 已由前置步骤写好当天日期,原样保留。改动固定展示结构或视觉风格前保持克制:非用户明确要求就保留现有结构与视觉、不要自行加回或改动既有元素(历次否决/撤销过的方案可查 git 历史)

            只修改工作区文件,不要自行 commit 或 push;后续步骤会统一校验、提交并推送。
          claude_args: |
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"

      # iOS 主屏小组件只读原始文本、不跑插件,所以文件开头那段 dataviewjs 就是小组件上的一屏代码。
      # 这一步把当天工作台压成固定五行人话写进 Home.md 顶部(页面里由 workbench.css 整段藏掉,视觉不变)。
      # 放在生成之后、提交之前,而不是写进 prompt:小组件第一行带日期,是"日更还在跑"在手机上
      # 唯一看得见的信号,这类兜底不挂在 prompt 遵守上。
      - name: 写入小组件速览段
        run: python3 Meta/scripts/update_widget_block.py

      # 一读查重放在提交之前:重复的稿子一旦推上去,用户第二天才看得见,而那时
      # 台账已经把它记成"出过了",下一期反而会拿它当合法的去重依据。
      # 拦在这里失败,auto-rerun.yml 会整轮重跑,新一轮生成时台账没变、稿会换。
      - name: 重建索引并体检
        run: |
          python3 Meta/scripts/build_memory_index.py
          python3 Meta/scripts/lint_memory.py
          python3 Meta/scripts/reading_log.py --check
          # 简讯:位置、每条有来源链接、每条有「影响」且扯到车的不超过 1 条、和上一期不撞链接。拦住了 auto-rerun 会整轮重跑
          python3 Meta/scripts/check_news_brief.py
          # 画作查重同样拦在提交之前:重复的画推上去,用户第二天才看得见。
          # --check 不通过整步失败,auto-rerun.yml 整轮重跑时台账没变、会换一幅。
          # 注意「3 幅候选都验证失败就保留前一天」这条兜底现在也会被判成重复而失败——
          # 那正是要的:静默重复过一次半年内放进来七幅,红着的任务比不响的强。
          python3 Meta/scripts/painting_log.py --check
          # 导览:挑画时已清空,模型没写或写坏了这里拦住,不让新画挂着空导览/坏 frontmatter 推上去
          python3 Meta/scripts/painting_guide.py --check
          python3 Meta/scripts/painting_log.py --record

      - name: 有变化就提交推送
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "workbench-bot"
          git config user.email "actions@users.noreply.github.com"
          # claude-code-action 内部 checkout 收尾时会 unset 外层持久化的 extraheader,抹掉
          # GITHUB_TOKEN 凭证。所以不依赖被持久化的凭证,push 时当场用 GITHUB_TOKEN 显式认证。
          git config --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          git add -A
          if git diff --cached --quiet; then
            echo "今日工作台没有变化"
          else
            git commit -m "工作台日更:$(TZ=Asia/Shanghai date +%F)"
            bash Meta/scripts/git_push_retry.sh "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "${{ github.ref_name }}"
          fi
