# 每周五北京时间 19:00 从候选池里挑一条选题,写成选题卡推进 Works/选题/,
# 并开一个 issue 通知主人。需要仓库 secret:CLAUDE_CODE_OAUTH_TOKEN(与日更、GC 共用)。
#
# 为什么落在 Works/ 而不是 Notes/:选题卡是产出侧的东西,不是想通的结论。
# 为什么单开 Works/选题/ 子目录:publish_candidates.py 把「Works/ 里引用了某篇笔记」
# 当成那篇笔记「在写」的信号。机器人每周推一条,如果推的卡片算数,候选池会被自己推空,
# 而用户一个字都没写。所以那个脚本排除这个目录;**用户真开写,把文件 git mv 出去**,
# 这一下移动就是「从选题变成在写」的状态切换(见 Works/README.md)。
#
# GitHub 的 schedule 不保证准点,高峰期常延迟几分钟到十几分钟,偶尔整点漏跑。
# 漏跑不补——选题不是有时效的东西,下周照常;要立刻拿一条就手动 workflow_dispatch。
name: 每周选题

on:
  schedule:
    - cron: "0 11 * * 5" # UTC 周五 11:00 = 北京时间周五 19:00
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write
  id-token: write

# 和日更、GC 共用一个并发组:同一时间只允许一个在推,后来的排队。
concurrency:
  group: memory-bot-push
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 出候选池和最近推过的名单
        id: prep
        run: |
          mkdir -p Works/选题
          python3 Meta/scripts/publish_candidates.py > "$RUNNER_TEMP/candidates.txt"
          cp "$RUNNER_TEMP/candidates.txt" .pick-candidates.txt

          # 最近 8 期推过的来源路径,这次不许再选——不然候选池排序稳定,
          # 每周都会挑到同一条,一个月后这条 workflow 就变成噪音了。
          ls -1 Works/选题/*.md 2>/dev/null | sort | tail -8 \
            | xargs -r grep -ho -E '(Notes|Concepts)/[^ )）】」』,,;;、]+\.md' \
            | sort -u > .pick-history.txt || true
          echo "最近推过 $(wc -l < .pick-history.txt) 条"

          # 候选池空了就不叫 Claude,省一次调用。数字从 --count 拿,不去 grep
          # 上面那份给人读的输出——标题措辞一改,grep 会静默失灵、当成"池子没空"
          COUNTS=$(python3 Meta/scripts/publish_candidates.py --count)
          echo "$COUNTS"
          NOTES=${COUNTS#notes=}; NOTES=${NOTES%% *}
          CONCEPTS=${COUNTS##*concepts=}
          if [ "$NOTES" -eq 0 ] && [ "$CONCEPTS" -eq 0 ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Claude 挑一条并写成选题卡
        if: steps.prep.outputs.empty != 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            当前目录是个人记忆库仓库(jadecoltrane/memory)。任务:从候选池里挑**一条**这周最值得写的选题,写成一张选题卡。

            输入:
            - `.pick-candidates.txt` —— `publish_candidates.py` 的输出,🧠 那组是核心层还没发过的笔记(带 ⚠️ 的有现成冲突、排在前面并给了钩子;没 ⚠️ 的也可以选,只是没有现成冲突),💥 那组是概念页的开放问题,一条开放问题就是一个选题。两组都可以选。
            - `.pick-history.txt` —— 最近 8 期推过的来源路径,**这次一条都不许再选**(文件为空说明还没推过)。

            挑之前必读 `Notes/练习/写作/小红书写作定位-半知识型与从冲突开始而非从观点开始.md`,按用户自己定的写作定位来挑,不要按"哪条看起来最有道理"挑。选中之后把那篇笔记(或概念页)完整读一遍再动笔,不要只凭候选池里那两行摘要。

            怎么挑(顺序就是优先级):
            1. **优先带 ⚠️ 冲突的**:有两个说法互相顶着、或一句用户还没调和的 ⚠️,自带钩子最好起笔。带 ⚠️ 的里挑不出合适的(都推过了、或都写不动),再从没 ⚠️ 的核心笔记里挑一条足够有分量的——这时卡片里「冲突在哪」如实写「这条没有现成冲突,角度得自己找」,别硬编一个矛盾出来。
            2. **是用户自己的判断**,不是外部知识的转述。
            3. **这周写得动**:一篇的量,不需要先去查资料才能开写。

            写成 `Works/选题/<YYYY-MM-DD>-<短主题名>.md`(日期用北京时间的这个周五)。

            **frontmatter 只放来源**,一到三条,纯文本路径不做双链(见 Works/README.md):

            ```
            ---
            sources:
              - Notes/xxx.md
              - Concepts/xxx.md
            published:
            ---
            ```

            来源写在 frontmatter 而不是正文里,是因为用户开写时会把正文整段删掉重写——路径搁正文里会跟着没了,那篇笔记就永远回不到「在写」。frontmatter 是正文重写时唯一不会被顺手删掉的地方。

            `published:` **留空写进去**,不要填值也不要省略:空值不会被 `publish_candidates.py` 当成已发(那个正则要求冒号后面有内容),但它把字段名和位置摆在了眼前——发出去时填「渠道 日期」就行,不用回头查键名叫什么。

            正文按这个结构,**不超过 400 字**:
            - 一句话说这周为什么是它(冲突在哪)。
            - **可以从这句开头**:从原文里挑一句能直接当开头的原话,原样引用,注明它出自哪篇。
            - **两三个可写的角度**,每个一行,允许互相矛盾。
            - 最后一行固定写:`不想写就删掉这个文件,下周照常。真要写,在 Obsidian 里把它拖到 Works/ 下面(拖出「选题」这个文件夹就行),正文随便删改,留着 frontmatter 就行。发出去之后把 published 填成「渠道 日期」,下次 GC 会自动把它同步进 sources 里那几篇笔记。`

            纪律:
            - **只推荐,不代写**。不要在卡片里替用户把观点写出来、不要拟好段落、不要给结论——他要的是一个起点,不是一篇被写完的东西。
            - 卡片里不写"AI 觉得""上次推过什么""这是第几次"(见 CLAUDE.md:不记 AI 和用户的互动史)。
            - 同时把给主人看的通知正文写进仓库根目录 `.pick-issue.txt`:选了哪条、一句话理由、卡片路径。不超过 8 行。

            只改工作区文件,不要 commit、push 或调用 gh;后面的步骤统一提交和开 issue。
          claude_args: |
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep"

      - name: 提交并推送选题卡
        if: steps.prep.outputs.empty != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f .pick-candidates.txt .pick-history.txt
          git config user.name "memory-pick-bot"
          git config user.email "actions@users.noreply.github.com"
          # claude-code-action 内部那次 checkout 收尾时会 unset 外层 checkout 持久化的
          # extraheader,把凭证一并抹掉,所以 push 时当场用 GITHUB_TOKEN(同 weekly-gc.yml)。
          git config --unset-all http.https://github.com/.extraheader 2>/dev/null || true
          cp -f .pick-issue.txt "$RUNNER_TEMP/pick-issue.txt" 2>/dev/null || true
          rm -f .pick-issue.txt
          git add -A
          if git diff --cached --quiet; then
            echo "本周没有产出选题卡"
          else
            git commit -m "本周选题:$(TZ=Asia/Shanghai date +%F)"
            bash Meta/scripts/git_push_retry.sh "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "${{ github.ref_name }}"
          fi

      - name: 开 issue 通知主人
        if: steps.prep.outputs.empty != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY="$RUNNER_TEMP/pick-issue.txt"
          [ -s "$BODY" ] || echo "本周选题跑完了,但没写出通知正文。去 Works/选题/ 看看有没有新卡片。" > "$BODY"
          # 指派 + 正文 @ 主人:bot 用 GITHUB_TOKEN 开的 issue,不指派就只有
          # watch 级别为 All Activity 的人收得到邮件(同 weekly-gc.yml 的注释)。
          { echo "cc @${{ github.repository_owner }}"; echo; cat "$BODY"; } > "$RUNNER_TEMP/issue-body.md"
          gh issue create --title "本周选题:$(TZ=Asia/Shanghai date +%F)" \
            --assignee "${{ github.repository_owner }}" \
            --body-file "$RUNNER_TEMP/issue-body.md"

      - name: 候选池空了也要说一声
        if: steps.prep.outputs.empty == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -f .pick-candidates.txt .pick-history.txt
          # 静默跳过是最坏的结果:主人会以为机器人在跑,其实什么都没发生。
          cat > "$RUNNER_TEMP/issue-body.md" <<'EOF'
          cc @${{ github.repository_owner }}

          这周没挑出选题,因为候选池是空的:核心层里还没发过的笔记 0 篇,概念页开放问题 0 条。

          这不一定是坏事——可能是能写的都在写了。想确认自己跑一句:`python3 Meta/scripts/publish_candidates.py`
          EOF
          gh issue create --title "本周选题:$(TZ=Asia/Shanghai date +%F)(候选池空)" \
            --assignee "${{ github.repository_owner }}" \
            --body-file "$RUNNER_TEMP/issue-body.md"
