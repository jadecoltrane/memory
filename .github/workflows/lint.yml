# 每次推送做记忆库体检。规则不再只靠 AI 自觉遵守。
# 错误(断链、frontmatter 缺失)→ 退出码 1,workflow 亮红灯 + 邮件通知。
# 警告(note→note 超标、概念裸奔、文件夹膨胀、概念页延伸超限)→ 不阻断,
#   打进 job summary,当期没修就是下次 GC 第 5 步的工单。
#
# 曾经还查一件跟内容无关但更要命的事:**仓库可见性**。2026-08-16 按用户要求删了。
# 背景留在这里,别当成没发生过:库里是画像、日记这类私人内容,git 历史里还留着
# 曾经原样入库、未脱敏的对话导出原文(那个目录已删,历史没重写),所以"仓库始终
# private" 仍然要守;这个库 2026-07-11 因为默认公开泄露过一次,补救要重写 82 个提交,
# 而且 GitHub 缓存的旧提交仍可通过旧 SHA 直链访问。
# 现在这条线**只靠人记得**——仓库变公开不会有任何自动告警。
name: 记忆库体检

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 体检(错误阻断,警告进摘要)
        run: |
          set -o pipefail
          python3 Meta/scripts/lint_memory.py 2>&1 | tee /tmp/lint.txt

      - name: 警告写进 job summary
        if: always()
        run: |
          {
            echo "## 记忆库体检"
            echo '```'
            cat /tmp/lint.txt 2>/dev/null || echo "(无输出)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
